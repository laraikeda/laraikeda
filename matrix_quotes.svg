<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <style>
    .matrix-text {
      font-family: 'Consolas', 'Fira Code', 'Courier New', Monaco, monospace;
      font-size: 28px;
      fill: #00FF00;
    }
    
    .line1 { opacity: 0; animation: fadeIn 0.5s forwards 0.5s; }
    .line2 { opacity: 0; animation: fadeIn 0.5s forwards 2.5s; }
    .line3 { opacity: 0; animation: fadeIn 0.5s forwards 4.5s; }
    .line4 { opacity: 0; animation: fadeIn 0.5s forwards 6.5s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>

  <rect width="100%" height="100%" fill="#0d1117" rx="10"/>

  <text x="40" y="60" class="matrix-text line1">> Wake up...</text>
  <text x="40" y="110" class="matrix-text line2">> The Matrix has you...</text>
  <text x="40" y="160" class="matrix-text line3">> Follow the white rabbit.</text>
  <text x="40" y="230" class="matrix-text line4">> Knock, knock.</text>
</svg>
