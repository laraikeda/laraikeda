<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <style>
    .matrix-text {
      font-family: 'Consolas', 'Fira Code', 'Courier New', Monaco, monospace;
      font-size: 28px;
      fill: #00FF00;
    }
    
    /* Animações de revelação da esquerda para a direita */
    .reveal1 { animation: typing 1.5s steps(15, end) forwards 0.5s; }
    .reveal2 { animation: typing 2s steps(22, end) forwards 2.3s; }
    .reveal3 { animation: typing 2.5s steps(26, end) forwards 4.6s; }
    .reveal4 { animation: typing 1.5s steps(15, end) forwards 7.4s; }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
  </style>

  <defs>
    <!-- Máscaras que revelam o texto progressivamente da esquerda para a direita -->
    <clipPath id="clip1">
      <rect x="0" y="0" width="0" height="40" class="reveal1"/>
    </clipPath>
    <clipPath id="clip2">
      <rect x="0" y="0" width="0" height="40" class="reveal2"/>
    </clipPath>
    <clipPath id="clip3">
      <rect x="0" y="0" width="0" height="40" class="reveal3"/>
    </clipPath>
    <clipPath id="clip4">
      <rect x="0" y="0" width="0" height="40" class="reveal4"/>
    </clipPath>
  </defs>

  <!-- Linhas com as máscaras aplicadas -->
  <text x="40" y="60" class="matrix-text" clip-path="url(#clip1)">> Wake up...</text>
  <text x="40" y="110" class="matrix-text" clip-path="url(#clip2)">> The Matrix has you...</text>
  <text x="40" y="160" class="matrix-text" clip-path="url(#clip3)">> Follow the white rabbit.</text>
  <text x="40" y="230" class="matrix-text" clip-path="url(#clip4)">> Knock, knock.</text>
</svg>
